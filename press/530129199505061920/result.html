<script>
    (function() {
        function pressWithTimestamp(url) {
            try {
                var target = new URL(url, window.location.href);
                target.searchParams.set('t', Date.now().toString());
                return target.toString();
            } catch (error) {
                return url;
            }
        }

        function pressEnsureFreshTimestamp() {
            try {
                var currentUrl = new URL(window.location.href);
                var rawTimestamp = (currentUrl.searchParams.get('t') || '').trim();
                var timestamp = Number(rawTimestamp);
                var isValidTimestamp = rawTimestamp !== '' && Number.isFinite(timestamp);
                if (isValidTimestamp && Math.abs(Date.now() - timestamp) <= 5000) {
                    return true;
                }
                window.location.replace(pressWithTimestamp(window.location.href));
                return false;
            } catch (error) {
                return true;
            }
        }
        pressEnsureFreshTimestamp();
    })();
</script>

    <script src="./config.js"></script>

    <script>
        (function() {
            function pressWithTimestamp(url) {
                try {
                    var target = new URL(url, window.location.href);
                    target.searchParams.set('t', Date.now().toString());
                    return target.toString();
                } catch (error) {
                    return url;
                }
            }

            function pressEnsureFreshTimestamp() {
                try {
                    var currentUrl = new URL(window.location.href);
                    var rawTimestamp = (currentUrl.searchParams.get('t') || '').trim();
                    var timestamp = Number(rawTimestamp);
                    var isValidTimestamp = rawTimestamp !== '' && Number.isFinite(timestamp);
                    if (isValidTimestamp && Math.abs(Date.now() - timestamp) <= 5000) {
                        return true;
                    }
                    window.location.replace(pressWithTimestamp(window.location.href));
                    return false;
                } catch (error) {
                    return true;
                }
            }

            function ready(fn) {
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', fn);
                } else {
                    fn();
                }
            }

            function text(value, fallback) {
                value = value == null ? '' : String(value);
                return value || fallback || '';
            }

            function escapeHtml(value) {
                return text(value).replace(/[&<>"']/g, function(char) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[char];
                });
            }

            function escapeAttr(value) {
                return escapeHtml(value);
            }

            function profile() {
                return (window.PRESS_CONFIG && window.PRESS_CONFIG.account) || {};
            }

            function splitDate(value) {
                var raw = text(value);
                var parts = raw.match(/\d+/g) || [];
                return {
                    year: parts[0] || '',
                    month: parts[1] || '',
                    day: parts[2] || ''
                };
            }

            function setInput(id, value) {
                var el = document.getElementById(id);
                if (el) el.value = value || '';
            }

            function randomDigit() {
                return String(Math.floor(Math.random() * 10));
            }

            function randomColor() {
                var palette = ['#d43c33', '#2f7dd1', '#198754', '#a855f7', '#d97706', '#0f766e'];
                return palette[Math.floor(Math.random() * palette.length)];
            }

            function paintFakeCaptcha(button) {
                if (!button) return;
                var digits = [randomDigit(), randomDigit(), randomDigit(), randomDigit()];
                button.value = digits.join(' ');
                button.setAttribute('aria-label', digits.join(''));
                button.style.fontWeight = '700';
                button.style.letterSpacing = '2px';
                button.style.textIndent = '0';
                button.style.color = randomColor();
                button.style.backgroundColor = '#f5f7fa';
                button.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,0.95), rgba(226,232,240,0.9))';
                button.style.border = '1px solid #b8b8b8';
                button.style.borderRadius = '4px';
                button.style.fontFamily = 'Georgia, "Times New Roman", serif';
                button.style.cursor = 'pointer';
            }

            function normalize(value) {
                return text(value).replace(/\s+/g, '');
            }

            function installSearch() {
                var data = profile();
                setInput('MEDIUM_DEPT_NAME', '');
                setInput('PRESS_NAME', '');
                setInput('input1', '');
                setInput('checkCode', '');
                var passwordInput = document.getElementById('input1');
                if (passwordInput) {
                    passwordInput.type = 'password';
                    passwordInput.setAttribute('autocomplete', 'off');
                }
                var fakeCaptcha = document.getElementById('checkCode');
                paintFakeCaptcha(fakeCaptcha);
                if (fakeCaptcha) {
                    fakeCaptcha.type = 'button';
                    fakeCaptcha.addEventListener('click', function(event) {
                        event.preventDefault();
                        paintFakeCaptcha(fakeCaptcha);
                    });
                }
                var refreshLink = document.querySelector('.idcode2 a');
                if (refreshLink) {
                    refreshLink.addEventListener('click', function(event) {
                        event.preventDefault();
                        paintFakeCaptcha(fakeCaptcha);
                    });
                }

                var button = document.querySelector('.query-btn');
                if (!button) return;
                button.addEventListener('click', function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    if (event.stopImmediatePropagation) event.stopImmediatePropagation();
                    var code = document.getElementById('input1');
                    var error = document.getElementById('notemediocontentreport');
                    var codeValue = code ? code.value : '';
                    if (!normalize(codeValue)) {
                        alert('请输入后台生成密码');
                        if (code) code.focus();
                        return false;
                    }
                    if (codeValue !== text(data.password)) {
                        if (error) error.style.display = '';
                        alert('密码不正确');
                        if (code) code.focus();
                        return false;
                    }
                    if (error) error.style.display = 'none';
                    window.location.href = pressWithTimestamp('./result.html');
                    return false;
                }, true);
            }

            function resultRows(data) {
                return [
                    ['新闻单位:', data['新闻单位']],
                    ['新闻媒体:', data['新闻媒体']],
                    ['记者姓名:', data['记者姓名']],
                    ['性别:', data['性别']],
                    ['证件号:', data['证件号']],
                    ['状态:', data['状态'] || '正常'],
                    ['记者证号:', data['记者证号']],
                    ['发证时间:', data['发证时间']]
                ];
            }

            function installResult() {
                var data = profile();
                var list = document.getElementById('dataCxlist');
                if (list) {
                    var rows = resultRows(data).map(function(row) {
                        return '<li><span class="cx-label">' + escapeHtml(row[0]) + '</span><span class="cx-value">' + escapeHtml(text(row[1], '-')) + '</span></li>';
                    }).join('');
                    var photo = text(data['照片']);
                    list.innerHTML =
                        '<div class="cx-item">' +
                        '<div class="fl cx-l"><ul>' + rows + '</ul></div>' +
                        '<div class="fr cx-r" id="img_photo">' + (photo ? '<img src="' + escapeAttr(photo) + '">' : '') + '</div>' +
                        '<div class="fl ckxq"><div id="codetest"><a href="' + escapeAttr(pressWithTimestamp('./search_pc.html')) + '" press_no="' + escapeAttr(text(data['记者证号'])) + '">查看样证</a></div></div>' +
                        '<div class="clear"></div>' +
                        '</div>';
                }
            }

            function installSample() {
                var data = profile();
                var center = document.getElementById('dataCenter');
                if (!center) return;
                var date = splitDate(data['发证时间']);
                var photo = text(data['照片']);
                center.innerHTML =
                    '<li>' + (photo ? '<img src="' + escapeAttr(photo) + '">' : '') + '</li>' +
                    '<li>' + escapeHtml(text(data['证件号'], '-')) + '</li>' +
                    '<li>' + escapeHtml(text(data['记者证号'], '-')) + '</li>' +
                    '<li>' + escapeHtml(text(date.year, '-')) + '</li>' +
                    '<li>' + escapeHtml(text(date.month, '-')) + '</li>' +
